apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arprt
resources:
  - ../../default
  - ../../../examples/http-get
  - httproute.yaml
images:
  - name: arprt
    newName: registry.example.test/arprt
    newTag: dev
patches:
  - target:
      kind: ConfigMap
      name: arprt-config
    patch: |-
      - op: replace
        path: /data/publicBaseURL
        value: https://byos.example.test/arprt
