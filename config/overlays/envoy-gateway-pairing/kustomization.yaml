apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../envoy-gateway
patches:
  - target:
      kind: Deployment
      name: arprt
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --namespace=$(POD_NAMESPACE)
          - --enable-setup=true
