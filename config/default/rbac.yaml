apiVersion: v1
kind: ServiceAccount
metadata:
  name: arprt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arprt
rules:
  - apiGroups: [arprt.dayflower.github.io]
    resources: [trmnlscreens, trmnldevices]
    verbs: [get, list, watch]
  - apiGroups: [arprt.dayflower.github.io]
    resources: [trmnlscreens/status, trmnldevices/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arprt
subjects:
  - kind: ServiceAccount
    name: arprt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arprt
