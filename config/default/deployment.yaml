apiVersion: apps/v1
kind: Deployment
metadata:
  name: arprt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arprt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arprt
    spec:
      serviceAccountName: arprt
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: arprt:dev
          imagePullPolicy: IfNotPresent
          args: [--namespace=$(POD_NAMESPACE), --job-pvc=arprt-data, --metrics-bind-address=:8082]
          env:
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: arprt-config
                  key: publicBaseURL
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: byos
              containerPort: 8080
            - name: metrics
              containerPort: 8082
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/arprt
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arprt-data
