---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: arprtdevices.arprt.dayflower.github.io
spec:
  group: arprt.dayflower.github.io
  names:
    kind: ArprtDevice
    listKind: ArprtDeviceList
    plural: arprtdevices
    shortNames:
    - adevice
    singular: arprtdevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ArprtDevice represents one physical device, its assignment and
          observed state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ArprtDeviceSpec declares authentication, assignment and desired
              display overrides.
            properties:
              authSecretRef:
                description: AuthSecretRef names the same-namespace Secret holding
                  the device API key.
                properties:
                  name:
                    description: Name identifies an object in this resource namespace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              display:
                description: Display overrides individual resolved capabilities; omitted
                  fields use observations or model profiles.
                properties:
                  height:
                    format: int32
                    maximum: 4096
                    minimum: 1
                    type: integer
                  palette:
                    enum:
                    - gray4
                    - gray16
                    - spectra6
                    type: string
                  pngByteLimit:
                    description: 'PNGByteLimit is exclusive: the complete encoded
                      PNG must be smaller.'
                    format: int32
                    minimum: 1
                    type: integer
                  width:
                    format: int32
                    maximum: 4096
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: width and height must be specified together
                  rule: has(self.width) == has(self.height)
                - message: display exceeds the output pixel limit
                  rule: '!has(self.width) || !has(self.height) || self.width * self.height
                    <= 4194304'
              hardwareID:
                description: HardwareID optionally restricts registration to this
                  canonical uppercase MAC.
                maxLength: 17
                pattern: ^([0-9A-F]{2}:){5}[0-9A-F]{2}$
                type: string
              hardwareIDSecretRef:
                description: HardwareIDSecretRef optionally restricts registration
                  using a Secret value.
                properties:
                  key:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - key
                - name
                type: object
              playlistRef:
                description: PlaylistRef selects an ordered same-namespace screen
                  cycle.
                properties:
                  name:
                    description: Name identifies an object in this resource namespace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              rotation:
                default: 0
                description: |-
                  Rotation requests clockwise content rotation in degrees. Renderers apply it
                  while preserving the physical display dimensions of the output PNG.
                enum:
                - 0
                - 90
                - 180
                - 270
                format: int32
                type: integer
              screenRef:
                description: |-
                  ScreenRef selects one same-namespace Screen, exclusively with playlistRef.
                  Omitting both references enables name-sorted Screen discovery in this namespace.
                properties:
                  name:
                    description: Name identifies an object in this resource namespace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - authSecretRef
            type: object
            x-kubernetes-validations:
            - message: at most one of screenRef and playlistRef is permitted
              rule: '!(has(self.screenRef) && has(self.playlistRef))'
            - message: at most one hardware identity source is permitted
              rule: '!(has(self.hardwareID) && has(self.hardwareIDSecretRef))'
            - message: hardwareID source is immutable; replace the device to change
                identity
              rule: has(self.hardwareID) == has(oldSelf.hardwareID) && (!has(self.hardwareID)
                || self.hardwareID == oldSelf.hardwareID)
            - message: hardwareIDSecretRef source is immutable; replace the device
                to change identity
              rule: has(self.hardwareIDSecretRef) == has(oldSelf.hardwareIDSecretRef)
                && (!has(self.hardwareIDSecretRef) || self.hardwareIDSecretRef ==
                oldSelf.hardwareIDSecretRef)
          status:
            description: ArprtDeviceStatus records controller observations and durable
              display-cycle progress.
            properties:
              battery:
                description: Battery contains the latest retained battery observations.
                properties:
                  percent:
                    description: Percent is present only when measured, never inferred
                      from OG voltage.
                    maximum: 100
                    minimum: 0
                    type: number
                  voltage:
                    minimum: 0
                    type: number
                type: object
              conditions:
                description: Conditions reports readiness and reconciliation failures.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              device:
                description: Device contains reported hardware information, distinct
                  from resolved display capabilities.
                properties:
                  firmwareVersion:
                    description: FirmwareVersion retains the reported firmware version.
                    type: string
                  model:
                    description: Model retains the reported model identifier.
                    type: string
                  reportedDisplay:
                    description: |-
                      ReportedDisplayStatus stores individually valid parsed observations, even
                      when the pair is incomplete or exceeds safe output allocation bounds.
                    properties:
                      height:
                        format: int32
                        minimum: 1
                        type: integer
                      width:
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                type: object
              display:
                description: Display contains resolved capabilities, independently
                  of desired content rotation.
                properties:
                  height:
                    format: int32
                    minimum: 1
                    type: integer
                  palette:
                    enum:
                    - bw
                    - gray4
                    - gray16
                    - bwry
                    - spectra6
                    type: string
                  pngByteLimit:
                    description: Missing fields are readable legacy status, not capability
                      observations.
                    format: int32
                    minimum: 1
                    type: integer
                  sources:
                    description: DisplaySources records where each effective capability
                      was resolved.
                    properties:
                      dimensions:
                        enum:
                        - explicit
                        - reported
                        - profile
                        type: string
                      palette:
                        enum:
                        - explicit
                        - profile
                        type: string
                      pngByteLimit:
                        enum:
                        - explicit
                        - profile
                        type: string
                    required:
                    - dimensions
                    - palette
                    - pngByteLimit
                    type: object
                  width:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - height
                - palette
                - width
                type: object
              hardwareID:
                description: HardwareID mirrors the durable registration for this
                  device UID.
                maxLength: 17
                pattern: ^([0-9A-F]{2}:){5}[0-9A-F]{2}$
                type: string
              lastSeenAt:
                description: LastSeenAt records authenticated display activity; timestamp
                  writes are throttled.
                format: date-time
                type: string
              network:
                description: Network contains the latest retained Wi-Fi observations.
                properties:
                  rssi:
                    description: RSSI is the reported Wi-Fi received signal strength
                      in dBm.
                    format: int32
                    type: integer
                type: object
              observedGeneration:
                description: ObservedGeneration is the metadata generation evaluated
                  by the controller.
                format: int64
                minimum: 0
                type: integer
              screenCycle:
                description: ScreenCycle records the last successful Playlist/discovery
                  turn for replay and advancement.
                properties:
                  assignment:
                    description: Assignment fingerprints the current assignment membership
                      and order.
                    type: string
                  compatibilityFingerprint:
                    description: |-
                      CompatibilityFingerprint binds replay to output constraints, rotation and
                      processing semantics. Omission denotes a legacy turn, never current replay.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  entryIndex:
                    description: EntryIndex is the original zero-based assignment
                      position.
                    format: int32
                    maximum: 63
                    minimum: 0
                    type: integer
                  filename:
                    description: Filename is the filename returned in the successful
                      display response.
                    type: string
                  imageDigest:
                    description: ImageDigest identifies the immutable image bytes.
                    type: string
                  inputRevision:
                    description: InputRevision identifies the rendering definition
                      used for this turn.
                    type: string
                  screenUID:
                    description: ScreenUID identifies the exact Screen object served
                      in this turn.
                    type: string
                  servedAt:
                    description: ServedAt starts the replay window; replay does not
                      extend it.
                    format: date-time
                    type: string
                  target:
                    description: Target records the physical dimensions and palette
                      of the served image.
                    properties:
                      height:
                        format: int32
                        minimum: 1
                        type: integer
                      palette:
                        enum:
                        - bw
                        - gray4
                        - gray16
                        - bwry
                        - spectra6
                        type: string
                      width:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - height
                    - palette
                    - width
                    type: object
                required:
                - assignment
                - entryIndex
                - filename
                - imageDigest
                - inputRevision
                - screenUID
                - servedAt
                - target
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
