---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: trmnldevices.arprt.dayflower.github.io
spec:
  group: arprt.dayflower.github.io
  names:
    kind: TrmnlDevice
    listKind: TrmnlDeviceList
    plural: trmnldevices
    shortNames:
    - tdevice
    singular: trmnldevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              authSecretRef:
                description: LocalReference always refers to a resource in the object's
                  namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              hardwareID:
                description: HardwareID optionally restricts registration to this
                  canonical uppercase MAC.
                maxLength: 17
                pattern: ^([0-9A-F]{2}:){5}[0-9A-F]{2}$
                type: string
              hardwareIDSecretRef:
                description: HardwareIDSecretRef optionally restricts registration
                  using a Secret value.
                properties:
                  key:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - key
                - name
                type: object
              playlistRef:
                description: PlaylistRef selects an ordered same-namespace screen
                  cycle.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              screenRef:
                description: LocalReference always refers to a resource in the object's
                  namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - authSecretRef
            type: object
            x-kubernetes-validations:
            - message: at most one of screenRef and playlistRef is permitted
              rule: '!(has(self.screenRef) && has(self.playlistRef))'
            - message: at most one hardware identity source is permitted
              rule: '!(has(self.hardwareID) && has(self.hardwareIDSecretRef))'
            - message: hardwareID source is immutable; replace the device to change
                identity
              rule: has(self.hardwareID) == has(oldSelf.hardwareID) && (!has(self.hardwareID)
                || self.hardwareID == oldSelf.hardwareID)
            - message: hardwareIDSecretRef source is immutable; replace the device
                to change identity
              rule: has(self.hardwareIDSecretRef) == has(oldSelf.hardwareIDSecretRef)
                && (!has(self.hardwareIDSecretRef) || self.hardwareIDSecretRef ==
                oldSelf.hardwareIDSecretRef)
          status:
            properties:
