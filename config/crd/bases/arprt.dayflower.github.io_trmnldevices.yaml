                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              device:
                properties:
                  firmwareVersion:
                    type: string
                  model:
                    type: string
                type: object
              display:
                properties:
                  height:
                    format: int32
                    minimum: 1
                    type: integer
                  palette:
                    enum:
                    - bw
                    - gray4
                    - gray16
                    - bwry
                    type: string
                  width:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - height
                - palette
                - width
                type: object
              hardwareID:
                description: HardwareID mirrors the durable registration for this
                  device UID.
                maxLength: 17
                pattern: ^([0-9A-F]{2}:){5}[0-9A-F]{2}$
                type: string
              lastSeenAt:
                format: date-time
                type: string
              network:
                properties:
                  rssi:
                    format: int32
                    type: integer
                type: object
              observedGeneration:
                format: int64
                minimum: 0
                type: integer
              screenCycle:
                description: ScreenCycleStatus persists the last successful screen-cycle
                  display response.
                properties:
                  assignment:
                    type: string
                  filename:
                    type: string
                  imageDigest:
                    type: string
                  inputRevision:
                    type: string
                  screenUID:
                    type: string
                  servedAt:
                    format: date-time
                    type: string
                  target:
                    properties:
                      height:
                        format: int32
                        minimum: 1
                        type: integer
                      palette:
                        enum:
                        - bw
                        - gray4
                        - gray16
                        - bwry
                        type: string
                      width:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - height
                    - palette
                    - width
                    type: object
                required:
                - assignment
                - filename
                - imageDigest
                - inputRevision
                - screenUID
                - servedAt
                - target
                type: object
            type: object
        required:
