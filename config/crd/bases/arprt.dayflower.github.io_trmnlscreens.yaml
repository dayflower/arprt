---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: trmnlscreens.arprt.dayflower.github.io
spec:
  group: arprt.dayflower.github.io
  names:
    kind: TrmnlScreen
    listKind: TrmnlScreenList
    plural: trmnlscreens
    shortNames:
    - tscreen
    singular: trmnlscreen
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              overlay:
                description: Overlay controls optional controller bitmap drawing on
                  new deliveries.
                properties:
                  cycleCorners:
                    default: false
                    type: boolean
                  enabled:
                    default: false
                    type: boolean
                  items:
                    description: |-
                      Items omitted selects all items; an explicit empty array draws nothing.
                      A pointer preserves empty arrays through JSON and Kubernetes round trips.
                    items:
                      description: OverlayItem selects a display item; layout order
                        is independent of array order.
                      enum:
                      - timestamp
                      - battery
                      - wifi
                      type: string
                    maxItems: 3
                    type: array
                    x-kubernetes-list-type: set
                  margin:
                    description: |-
                      Margin insets foreground independently from the horizontal and vertical edges.
                      The opaque background extends through each inset to the display edges.
                    properties:
                      horizontal:
                        description: Horizontal is the inset from the selected left
                          or right edge.
                        format: int32
                        minimum: 0
                        type: integer
                      vertical:
                        description: Vertical is the inset from the selected top or
                          bottom edge.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  position:
                    description: Position is defaulted to top-right internally, never
                      by admission.
                    enum:
                    - top-right
                    - bottom-right
                    - bottom-left
                    - top-left
                    type: string
                  scale:
                    description: Scale omitted selects automatic scaling using physical
                      dimensions.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: position must be omitted when cycleCorners is true
                  rule: '!self.cycleCorners || !has(self.position)'
              refreshInterval:
                description: |-
                  RefreshInterval controls artifact freshness, not device polling. Effective
                  defaults are 5m for GET and 30m for Job; POST has no interval.
                maxLength: 32
                pattern: ^([0-9]+[hms])+$
                type: string
                x-kubernetes-validations:
                - message: interval must be between 1s and 24h in whole seconds
                  rule: duration(self) >= duration('1s') && duration(self) <= duration('24h')
              source:
                properties:
                  http:
                    properties:
                      method:
                        default: GET
                        enum:
                        - GET
                        - POST
                        type: string
                      url:
                        description: URL is operator-controlled; credentials and redirects
                          are not supported.
                        maxLength: 2048
                        pattern: ^https?://([A-Za-z0-9.-]+|\[[0-9A-Fa-f:]+\])(:[0-9]{1,5})?([/?]([^%#\x00-\x20\x7F]|%[0-9A-Fa-f]{2})*)?$
                        type: string
                        x-kubernetes-validations:
                        - message: renderer URL must be a valid absolute HTTP URL
                          rule: isURL(self)
                        - message: query semicolons must be percent-encoded
                          rule: '!self.matches(''[?].*;'')'
                    required:
                    - url
                    type: object
                  job:
                    description: JobSource paths designate files. Output's parent
                      is a dedicated writable mount.
                    properties:
                      contextPath:
                        default: /trmnl/context.json
                        maxLength: 512
                        pattern: ^/([^/\x00]+/)*[^/\x00]+$
                        type: string
                        x-kubernetes-validations:
                        - message: path must be a clean absolute POSIX file path
                          rule: '!self.split(''/'').exists(p, p == ''.'' || p == ''..'')'
                      imagePath:
                        default: /trmnl/output.png
                        maxLength: 512
                        pattern: ^/([^/\x00]+/)*[^/\x00]+$
                        type: string
                        x-kubernetes-validations:
                        - message: path must be a clean absolute POSIX file path
                          rule: '!self.split(''/'').exists(p, p == ''.'' || p == ''..'')'
                      renderer:
                        description: RendererContainer deliberately exposes only the
                          reusable container interface.
                        properties:
                          args:
                            items:
                              type: string
                            maxItems: 128
                            type: array
                          command:
                            items:
                              type: string
                            maxItems: 128
                            type: array
                          env:
                            items:
                              description: EnvVar represents an environment variable
                                present in a Container.
                              properties:
                                name:
                                  description: |-
                                    Name of the environment variable.
                                    May consist of any printable ASCII characters except '='.
                                  type: string
                                value:
                                  description: |-
                                    Variable references $(VAR_NAME) are expanded
                                    using the previously defined environment variables in the container and
                                    any service environment variables. If a variable cannot be resolved,
                                    the reference in the input string will be unchanged. Double $$ are reduced
                                    to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                                    "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                                    Escaped references will never be expanded, regardless of whether the variable
                                    exists or not.
                                    Defaults to "".
                                  type: string
                                valueFrom:
                                  description: Source for the environment variable's
                                    value. Cannot be used if value is not empty.
                                  properties:
                                    configMapKeyRef:
                                      description: Selects a key of a ConfigMap.
                                      properties:
                                        key:
                                          description: The key to select.
                                          type: string
                                        name:
                                          default: ""
                                          description: |-
                                            Name of the referent.
                                            This field is effectively required, but due to backwards compatibility is
                                            allowed to be empty. Instances of this type with an empty value here are
                                            almost certainly wrong.
                                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                          type: string
                                        optional:
                                          description: Specify whether the ConfigMap
                                            or its key must be defined
                                          type: boolean
                                      required:
                                      - key
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    fieldRef:
                                      description: |-
                                        Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                        spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                                      properties:
                                        apiVersion:
                                          description: Version of the schema the FieldPath
                                            is written in terms of, defaults to "v1".
                                          type: string
                                        fieldPath:
                                          description: Path of the field to select
                                            in the specified API version.
                                          type: string
                                      required:
                                      - fieldPath
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    fileKeyRef:
                                      description: |-
                                        FileKeyRef selects a key of the env file.
                                        Requires the EnvFiles feature gate to be enabled.
                                      properties:
                                        key:
                                          description: |-
                                            The key within the env file. An invalid key will prevent the pod from starting.
                                            The keys defined within a source may consist of any printable ASCII characters except '='.
                                            During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                          type: string
                                        optional:
                                          default: false
                                          description: |-
                                            Specify whether the file or its key must be defined. If the file or key
                                            does not exist, then the env var is not published.
                                            If optional is set to true and the specified key does not exist,
                                            the environment variable will not be set in the Pod's containers.

                                            If optional is set to false and the specified key does not exist,
                                            an error will be returned during Pod creation.
                                          type: boolean
                                        path:
                                          description: |-
                                            The path within the volume from which to select the file.
                                            Must be relative and may not contain the '..' path or start with '..'.
                                          type: string
                                        volumeName:
                                          description: The name of the volume mount
                                            containing the env file.
                                          type: string
                                      required:
                                      - key
                                      - path
                                      - volumeName
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    resourceFieldRef:
                                      description: |-
                                        Selects a resource of the container: only resources limits and requests
                                        (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                                      properties:
                                        containerName:
                                          description: 'Container name: required for
                                            volumes, optional for env vars'
                                          type: string
                                        divisor:
                                          anyOf:
                                          - type: integer
                                          - type: string
                                          description: Specifies the output format
                                            of the exposed resources, defaults to
                                            "1"
                                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                          x-kubernetes-int-or-string: true
                                        resource:
                                          description: 'Required: resource to select'
                                          type: string
                                      required:
                                      - resource
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    secretKeyRef:
                                      description: Selects a key of a secret in the
