apiVersion: v1
kind: Service
metadata:
  name: {{ include "arprt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arprt.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "arprt.selectorLabels" . | nindent 4 }}
  ports:
    - name: byos
      port: 8080
      targetPort: byos
