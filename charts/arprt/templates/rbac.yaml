apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arprt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arprt.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "arprt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arprt.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  {{- if .Values.credentials.authSecrets }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range .Values.credentials.authSecrets }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [get, patch]
  {{- end }}
  {{- if .Values.credentials.identitySecrets }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- toYaml .Values.credentials.identitySecrets | nindent 6 }}
    verbs: [get]
  {{- end }}
  - apiGroups: [arprt.dayflower.github.io]
    resources: [arprtscreens, arprtdevices, arprtplaylists]
    verbs: [get, list, watch]
  - apiGroups: [arprt.dayflower.github.io]
    resources: [arprtscreens/status, arprtdevices/status, arprtplaylists/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "arprt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arprt.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "arprt.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "arprt.fullname" . }}
