name: Set up Go with separate module and build caches
description: Restore main caches without allowing PR or release jobs to save.
inputs:
  purpose:
    description: Unique job and build-condition lane
    required: true
  modules-writer:
    description: Sole module writer per native architecture
    default: 'false'
  build-writer:
    description: Sole build writer for this purpose per architecture
    default: 'true'
  kind-writer:
    description: Sole kind writer per native architecture
    default: 'false'
  tools:
    description: Space-separated development tools to restore
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: go
      with:
        go-version: '1.26.8'
        cache: false
    - id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "prefix=go-v1-${ImageOS}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}" >> "$GITHUB_OUTPUT"
    - uses: ./.ci-actions/.github/actions/cache
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: ${{ steps.paths.outputs.prefix }}-modules-${{ hashFiles('go.sum') }}
        writer: ${{ inputs.modules-writer }}
    - uses: ./.ci-actions/.github/actions/cache
      with:
        path: ${{ steps.paths.outputs.build }}
        key: ${{ steps.paths.outputs.prefix }}-build-${{ inputs.purpose }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.paths.outputs.prefix }}-build-${{ inputs.purpose }}-${{ hashFiles('go.sum') }}-
          ${{ steps.paths.outputs.prefix }}-build-${{ inputs.purpose }}-
        writer: ${{ inputs.build-writer }}
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.modules-writer == 'true'
      shell: bash
      run: go mod download
    - uses: ./.ci-actions/.github/actions/cache-tools
      with:
        tools: ${{ inputs.tools }}
        kind-writer: ${{ inputs.kind-writer }}
