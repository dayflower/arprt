name: checks
on:
  push:
    branches: [main]
  pull_request:
  # Explicit full checks for changes whose documentation scope is uncertain.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      software: ${{ steps.scope.outputs.software }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: python3 tools/ci-scope.py "$BASE_REVISION" "$HEAD_REVISION"
      - run: python3 tools/check-docs.py
        env:
          DOC_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: make release-check
  contracts:
    needs: changes
    # Keep this existing required-check name active for documentation failures.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change and documentation checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.software != 'false'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.software != 'false'
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.software != 'false'
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.changes.outputs.software != 'false'
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: Makefile
      - name: Verify generation, lint, formatting, tests and build
        run: make verify
        if: needs.changes.outputs.software != 'false'
  api:
    needs: changes
    if: always() && needs.changes.outputs.software != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - run: make integration ENVTEST_K8S_VERSION=1.36.0

  cluster:
    needs: changes
    if: always() && needs.changes.outputs.software != 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - run: make docker-build IMAGE=arprt:ci
      - run: make image-benchmark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-benchmark-${{ matrix.runner }}
          path: dist/acceptance/image-benchmark.json

  helm:
    needs: changes
    if: always() && needs.changes.outputs.software != 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - run: make chart-check
      - run: make integration ENVTEST_K8S_VERSION=1.36.0
      - run: make docker-build IMAGE=arprt:helm-ci
      - run: make helm-smoke IMAGE=arprt:helm-ci LOAD_IMAGE=true
        env:
          ARPRT_IMAGE_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/dist/acceptance/image-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-acceptance-${{ matrix.runner }}
          path: dist/acceptance/image-smoke.json
