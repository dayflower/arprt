name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: make verify
      - run: make docker-build
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes: ['1.36.0', '1.36.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: make integration ENVTEST_K8S_VERSION=${{ matrix.kubernetes }}

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: kind create cluster --name arprt-ci --image kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed --wait 90s
      - run: make docker-build IMAGE=arprt:ci
      - run: kind load docker-image arprt:ci --name arprt-ci
      - run: make cluster-smoke IMAGE=arprt:ci
      - if: always()
        run: kind delete cluster --name arprt-ci
