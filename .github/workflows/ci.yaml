name: checks
on:
  push:
    branches: [main]
  pull_request:
  # Explicit full checks for changes whose documentation scope is uncertain.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      software: ${{ steps.scope.outputs.software }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: python3 tools/ci-scope.py "$BASE_REVISION" "$HEAD_REVISION"
      - run: python3 tools/check-docs.py
        env:
          DOC_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: make release-check
  contracts:
    needs: [changes, software, race]
    # Keep this existing required-check name active, including prose-only changes.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful documentation and selected software checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SOFTWARE_REQUIRED: ${{ needs.changes.outputs.software }}
          SOFTWARE_RESULT: ${{ needs.software.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SOFTWARE_REQUIRED" = false ]; then
            test "$SOFTWARE_RESULT" = skipped
            test "$RACE_RESULT" = skipped
          else
            test "$SOFTWARE_RESULT" = success
            test "$RACE_RESULT" = success
          fi

  software:
    needs: changes
    if: needs.changes.outputs.software != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: software
          tools: controller-gen staticcheck helm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: Makefile
      - name: Verify generation, dependencies, lint, formatting and build
        run: make verify-checks

  race:
    needs: changes
    if: needs.changes.outputs.software != 'false'
    strategy:
      fail-fast: false
      matrix:
        target: [test-default, test-gray4-native4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: race-${{ matrix.target }}
      - run: make ${{ matrix.target }}

  api:
    needs: changes
    if: always() && needs.changes.outputs.software != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: api
          tools: controller-gen setup-envtest helm envtest
      - run: make integration ENVTEST_K8S_VERSION=1.36.0

  cluster:
    needs: changes
    if: always() && needs.changes.outputs.software != 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: cluster
      - run: make docker-build IMAGE=arprt:ci
      - run: make image-benchmark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-benchmark-${{ matrix.runner }}
          path: dist/acceptance/image-benchmark.json

  helm_prepare:
    needs: changes
    if: always() && needs.changes.outputs.software != 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: helm_prepare
          tools: controller-gen setup-envtest helm envtest staticcheck
          modules-writer: 'true'
      - run: make chart-check
      - run: make integration ENVTEST_K8S_VERSION=1.36.0
      - run: make docker-build IMAGE=arprt:helm-ci
      - run: docker save arprt:helm-ci --output dist/charts/helm-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-inputs-${{ matrix.runner }}
          path: dist/charts/
          if-no-files-found: error
          retention-days: 7

  helm_smoke:
    needs: [changes, helm_prepare]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        scope: [lifecycle, jobs, functional]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: helm_smoke-${{ matrix.scope }}
          tools: kind helm
          kind-writer: ${{ matrix.scope == 'functional' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-inputs-${{ matrix.runner }}
          path: dist/helm-inputs
      - run: docker load --input dist/helm-inputs/helm-image.tar
      - run: make helm-release-smoke CHART_OUTPUT="$PWD/dist/helm-inputs" IMAGE=arprt:helm-ci LOAD_IMAGE=true HELM_SMOKE_SCOPE="${{ matrix.scope }}"
        env:
          ARPRT_IMAGE_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/dist/acceptance/image-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.scope == 'functional'
        with:
          name: image-acceptance-${{ matrix.runner }}
          path: dist/acceptance/image-smoke.json

  helm:
    # Preserve both existing native required-check names and propagate any failure.
    needs: [changes, helm_prepare, helm_smoke]
    if: always() && needs.changes.outputs.software != 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require all Helm preparation and cluster checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PREPARE_RESULT: ${{ needs.helm_prepare.result }}
          SMOKE_RESULT: ${{ needs.helm_smoke.result }}
        run: test "$CHANGES_RESULT" = success && test "$PREPARE_RESULT" = success && test "$SMOKE_RESULT" = success
