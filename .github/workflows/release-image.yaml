name: release distribution
on:
  push:
    tags: ['v*']
  # Repeat public acceptance after the first package's visibility is set to public.
  # This path reruns validation without pushing or overwriting packages.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string
      digest:
        description: Published multi-platform image index digest (sha256:...)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Serialize chart version checks and pushes across controller release tags.
  group: release-distribution
  cancel-in-progress: false
jobs:
  guard:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      chart_version: ${{ steps.charts.outputs.chart_version }}
      crd_version: ${{ steps.charts.outputs.crd_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/cache-tools
        with:
          tools: helm
      - id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 tools/release-image.py guard "$RELEASE_TAG"
      - id: charts
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: make release-chart-metadata VERSION="$RELEASE_VERSION"
      - name: Check release availability before native validation and publication
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: make release-preflight

  # Independent software checks run alongside the native build/cluster jobs.
  software:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          # Whitespace checks need parent history, including merge commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: software
          tools: controller-gen staticcheck helm setup-envtest envtest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: Makefile
      - name: Verify generation, dependencies, lint, formatting and build
        run: make verify-checks
      - run: python3 tools/check-docs.py
      - run: make integration ENVTEST_K8S_VERSION=1.36.0

  race:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        target: [test-default, test-gray4-native4]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: race-${{ matrix.target }}
      - run: make ${{ matrix.target }}

  checks:
    needs: [guard, software, race]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native software checks and both race builds
        env:
          GUARD_RESULT: ${{ needs.guard.result }}
          SOFTWARE_RESULT: ${{ needs.software.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$GUARD_RESULT" = success
          test "$SOFTWARE_RESULT" = success
          test "$RACE_RESULT" = success

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_REVISION: ${{ needs.guard.outputs.revision }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: cluster
          tools: helm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and check native release image
        run: |
          test "$(go env GOARCH)" = "$ARCH"
          docker buildx build --platform "linux/$ARCH" --provenance=false --load \
            --build-arg VERSION="$RELEASE_VERSION" --build-arg REVISION="$RELEASE_REVISION" \
            --tag "arprt:release-$ARCH" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "arprt:release-$ARCH")" = "linux/$ARCH"
          test "$(docker run --rm --platform "linux/$ARCH" "arprt:release-$ARCH" --version)" = "arprt $RELEASE_VERSION ($RELEASE_REVISION)"
      - run: make image-benchmark
      - run: make chart-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-resources-${{ matrix.arch }}
          path: dist/acceptance/*.json
          retention-days: 90
      - name: Export the candidate image (publication still requires validation)
        run: docker save "arprt:release-$ARCH" --output "/tmp/image-$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-charts-${{ matrix.arch }}
          path: dist/charts/*.tgz
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: [guard, build]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        scope: [lifecycle, suites]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: helm_smoke-${{ matrix.scope }}
          tools: kind helm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-${{ matrix.arch }}
          path: /tmp/release-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-smoke-charts-${{ matrix.arch }}
          path: dist/smoke-charts
      - run: docker load --input "/tmp/release-image/image-${{ matrix.arch }}.tar"
      - run: make helm-release-smoke CHART_OUTPUT="$PWD/dist/smoke-charts" IMAGE="arprt:release-${{ matrix.arch }}" LOAD_IMAGE=true HELM_SMOKE_SCOPE="${{ matrix.scope }}"
        env:
          ARPRT_IMAGE_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/dist/acceptance/image-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.scope == 'suites'
        with:
          name: image-acceptance-${{ matrix.arch }}
          path: dist/acceptance/image-smoke.json
          retention-days: 90

  publish:
    if: github.event_name == 'push'
    needs: [guard, checks, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_REVISION: ${{ needs.guard.outputs.revision }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.guard.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/release-image.py guard "$RELEASE_TAG"
      - name: Refuse an existing version or platform tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 tools/release-image.py unused "$REPOSITORY" "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          path: /tmp/release-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested platform images
        run: |
          for arch in amd64 arm64; do
            docker load --input "/tmp/release-images/image-$arch.tar"
            docker tag "arprt:release-$arch" "$IMAGE:$RELEASE_TAG-$arch"
            docker push "$IMAGE:$RELEASE_TAG-$arch"
          done
      - id: index
        name: Assemble and record multi-platform index
        run: |
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" \
            --annotation 'index:org.opencontainers.image.description=ARPRT is an independent, unofficial Kubernetes controller for TRMNL BYOS. It is not affiliated with or endorsed by TRMNL.' \
            "$IMAGE:$RELEASE_TAG-amd64" "$IMAGE:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$RELEASE_TAG" > /tmp/image-index.json
          digest=$(python3 -c 'import json; print(json.load(open("/tmp/image-index.json"))["digest"])')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published image: `%s:%s`\n\nIndex digest: `%s`\n\nSet the GHCR package to public before anonymous acceptance.\n' "$IMAGE" "$RELEASE_TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-index
          path: /tmp/image-index.json
          if-no-files-found: error
          retention-days: 90

  acceptance:
    needs: [guard, checks, validate, publish]
    if: >-
      always() && needs.guard.result == 'success' &&
      needs.checks.result == 'success' && needs.validate.result == 'success' &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_REVISION: ${{ needs.guard.outputs.revision }}
      INDEX_DIGEST: ${{ needs.publish.outputs.digest || inputs.digest }}
      REPOSITORY: ${{ github.repository }}
      ARCH: ${{ matrix.arch }}
      # Empty config: no login or registry credentials during acceptance.
      DOCKER_CONFIG: /tmp/arprt-anonymous-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: acceptance
      - name: Verify public index, platforms and metadata anonymously
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 tools/release-image.py inspect "$REPOSITORY" "$RELEASE_TAG" "$INDEX_DIGEST" "$RELEASE_REVISION" /tmp/image-digests.json
      - name: Anonymous platform selection and startup
        run: |
          test "$(go env GOARCH)" = "$ARCH"
          docker pull --platform "linux/$ARCH" "ghcr.io/$REPOSITORY:$RELEASE_TAG"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "ghcr.io/$REPOSITORY:$RELEASE_TAG")" = "linux/$ARCH"
          docker pull --platform "linux/$ARCH" "ghcr.io/$REPOSITORY@$INDEX_DIGEST"
          test "$(docker run --rm --platform "linux/$ARCH" "ghcr.io/$REPOSITORY@$INDEX_DIGEST" --version)" = "arprt $RELEASE_VERSION ($RELEASE_REVISION)"
      - name: Record native public acceptance
        run: |
          printf 'PASS: native linux/%s anonymous tag/digest pulls and startup.\n\n' "$ARCH" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/image-digests.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-image-digests-${{ matrix.arch }}
          path: /tmp/image-digests.json
          if-no-files-found: error
          retention-days: 90

  chart_prepare:
    needs: [guard, publish, acceptance]
    if: always() && needs.guard.result == 'success' && needs.acceptance.result == 'success'
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      INDEX_DIGEST: ${{ needs.publish.outputs.digest || inputs.digest }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/cache-tools
        with:
          tools: helm
      - name: Resolve the validated image into the distribution packages
        run: make release-chart-prepare VERSION="$RELEASE_VERSION" CHART_OUTPUT="$PWD/dist/release-charts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-charts
          path: |
            dist/release-charts/*.tgz
            dist/release-charts/crds.yaml
            dist/release-charts/crds.yaml.sha256
          if-no-files-found: error
          retention-days: 90

  chart_validate:
    needs: [guard, publish, chart_prepare]
    if: always() && needs.chart_prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        scope: [lifecycle, suites]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      INDEX_DIGEST: ${{ needs.publish.outputs.digest || inputs.digest }}
      REPOSITORY: ${{ github.repository }}
      DOCKER_CONFIG: /tmp/arprt-anonymous-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: helm_smoke-${{ matrix.scope }}
          tools: kind helm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-charts
          path: dist/release-charts
      - run: make chart-check
      - name: Test the exact distribution packages against the public image
        run: make helm-release-smoke CHART_OUTPUT="$PWD/dist/release-charts" IMAGE="ghcr.io/$REPOSITORY@$INDEX_DIGEST" USE_CHART_IMAGE=true HELM_SMOKE_SCOPE="${{ matrix.scope }}"

  chart_publish:
    if: github.event_name == 'push'
    needs: [guard, chart_validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/cache-tools
        with:
          tools: helm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-charts
          path: dist/release-charts
      - name: Authenticate Helm to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-chart-login
      - name: Publish CRDs first, then the tested parent package
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-chart-publish VERSION="$RELEASE_VERSION" CHART_OUTPUT="$PWD/dist/release-charts"

  chart_verify:
    needs: [guard, publish, chart_validate, chart_publish]
    if: >-
      always() && needs.chart_validate.result == 'success' &&
      ((github.event_name == 'push' && needs.chart_publish.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && needs.chart_publish.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      INDEX_DIGEST: ${{ needs.publish.outputs.digest || inputs.digest }}
      REPOSITORY: ${{ github.repository }}
      CHART_VERSION: ${{ needs.guard.outputs.chart_version }}
      CRD_CHART_VERSION: ${{ needs.guard.outputs.crd_version }}
      DOCKER_CONFIG: /tmp/arprt-anonymous-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: charts
          tools: helm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-charts
          path: dist/release-charts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accepted-image-digests-${{ matrix.arch }}
          path: dist/acceptance
      - name: Verify anonymous chart contents and record immutable references
        run: make release-chart-verify VERSION="$RELEASE_VERSION" CHART_OUTPUT="$PWD/dist/release-charts" IMAGE_EVIDENCE=dist/acceptance/image-digests.json DISTRIBUTION_RECORD=dist/acceptance/distribution.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distribution-${{ matrix.arch }}
          path: dist/acceptance/
          if-no-files-found: error
          retention-days: 90

  chart_acceptance:
    needs: [guard, publish, chart_verify]
    if: always() && needs.chart_verify.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        scope: [lifecycle, suites]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      INDEX_DIGEST: ${{ needs.publish.outputs.digest || inputs.digest }}
      REPOSITORY: ${{ github.repository }}
      CHART_VERSION: ${{ needs.guard.outputs.chart_version }}
      CRD_CHART_VERSION: ${{ needs.guard.outputs.crd_version }}
      DOCKER_CONFIG: /tmp/arprt-anonymous-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.revision }}
          persist-credentials: false
      - name: Check out CI helpers from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/setup-go
        with:
          purpose: helm_smoke-${{ matrix.scope }}
          tools: kind helm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distribution-${{ matrix.arch }}
          path: dist/acceptance
      - name: Accept fresh installs and compatible upgrades using public chart digests
        run: make helm-published-smoke OCI_CHART_REPOSITORY="oci://ghcr.io/${REPOSITORY%/*}/charts" IMAGE="ghcr.io/$REPOSITORY@$INDEX_DIGEST" DISTRIBUTION_RECORD="$PWD/dist/acceptance/distribution.json" HELM_SMOKE_SCOPE="${{ matrix.scope }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-distribution-${{ matrix.arch }}-${{ matrix.scope }}
          path: |
            dist/acceptance/distribution.json
            dist/acceptance/crds.yaml
            dist/acceptance/crds.yaml.sha256
          if-no-files-found: error
          retention-days: 90

  announce:
    needs: [guard, chart_acceptance]
    if: always() && needs.guard.result == 'success' && needs.chart_acceptance.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_REVISION: ${{ needs.guard.outputs.revision }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accepted-distribution-*
          path: /tmp/acceptance
      - name: Publish acceptance record as a GitHub release
        run: |
          for arch in amd64 arm64; do
            for scope in lifecycle suites; do
              evidence="/tmp/acceptance/accepted-distribution-$arch-$scope"
              cmp /tmp/acceptance/accepted-distribution-amd64-lifecycle/distribution.json "$evidence/distribution.json"
              cmp /tmp/acceptance/accepted-distribution-amd64-lifecycle/crds.yaml "$evidence/crds.yaml"
              cmp /tmp/acceptance/accepted-distribution-amd64-lifecycle/crds.yaml.sha256 "$evidence/crds.yaml.sha256"
            done
          done
          (cd /tmp/acceptance/accepted-distribution-amd64-lifecycle && sha256sum --check crds.yaml.sha256)
          python3 - <<'PY' > /tmp/release-notes.md
          import json, os
          from pathlib import Path
          evidence = json.load(open('/tmp/acceptance/accepted-distribution-amd64-lifecycle/distribution.json'))
          image_keys = ('image', 'tag', 'version', 'revision', 'indexDigest', 'platformDigests', 'anonymousRegistryRead')
          Path('/tmp/image-digests.json').write_text(json.dumps({key: evidence[key] for key in image_keys}, indent=2) + '\n')
          print('ARPRT is an independent, unofficial Kubernetes controller for TRMNL BYOS. It is not affiliated with or endorsed by TRMNL.\n')
          print(f"Controller version: `{evidence['version']}`; source revision: `{evidence['revision']}`.\n")
          print(f"Image: `{evidence['image']}:{evidence['tag']}`\n")
          print(f"Multi-platform index: `{evidence['image']}@{evidence['indexDigest']}`\n")
          for platform, digest in evidence['platformDigests'].items():
              print(f'- {platform}: `{digest}`')
          print(f"\nBundled CRD dependency: `{evidence['dependencyVersion']}`")
          for name, chart in evidence['charts'].items():
              print(f"\nChart `{name}` version `{chart['version']}`: `{chart['reference']}@{chart['digest']}`")
          crds_url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{evidence['tag']}/crds.yaml"
          print(f"\n[CRD YAML]({crds_url}) and [SHA-256 checksum]({crds_url}.sha256) match CRD chart `{evidence['crds']['chartVersion']}`. For YAML-managed CRDs, keep `crds.enabled: false` from the controller's first install. See the README for installation instructions.")
          print('\nBoth native architectures passed verify, Kubernetes 1.36.0 envtest, Docker build and the complete Helm lifecycle and five-suite smoke matrix with the pinned Helm 4 client. Anonymous image and chart retrieval, fresh bundled/separate/YAML-managed installs, compatible config upgrades and the full Helm matrix using the public chart/image digests passed on both architectures.')
          print('\nPhysical-device checks are not required for publication and are not attested by this workflow. See the documented observations for hardware evidence.')
          print('Architecture publication does not expand device or storage support.')
          print(f"\n[Acceptance workflow](https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']})")
          PY
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "arprt $RELEASE_TAG" "${release_flags[@]}" \
            --notes-file /tmp/release-notes.md \
            /tmp/acceptance/accepted-distribution-amd64-lifecycle/distribution.json /tmp/image-digests.json \
            /tmp/acceptance/accepted-distribution-amd64-lifecycle/crds.yaml \
            /tmp/acceptance/accepted-distribution-amd64-lifecycle/crds.yaml.sha256
