apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: photo-overlay
spec:
  source:
    http:
      url: http://photo-renderer.arprt.svc/render?theme=light
  overlay:
    enabled: true
    # Omit items for all three; [] disables drawing without changing enablement.
    items: [timestamp, battery, wifi]
    # Shared clockwise corner cycle for this device UID; do not set position.
    # Foreground inset in bitmap pixels; the white background reaches the edges.
    margin:
      top: 4
      bottom: 4
      left: 12
      right: 12
    cycleCorners: true
