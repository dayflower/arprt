apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: edge-calibration
  namespace: arprt
spec:
  refreshInterval: 24h
  source:
    http:
      url: http://calibration-renderer:8000/render
  imageProcessing:
    resizeMode: contain
    dithering: none
  overlay:
    enabled: true
    cycleCorners: true
    items: [timestamp, battery, wifi]
